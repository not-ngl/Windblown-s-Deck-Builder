<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
</head>
<body>
    <div class="fixed-header">
    <div class="logo-container">
      <img src="./assets/wdb-logo.png" alt="Windblown's deck builder" style="height:40px; margin-top:6px" />
    </div>

    <main>
        <section class="categories-container">
            <nav id="tabs-wrapper" class="tabs-wrapper">
                <button class="tab-btn active" data-tab="weapons">
                    <img src="https://windblown.wiki.gg/images/Weapons_Icon.png?format=original" alt="" class="tab-icon">
                    <span class="tab-info" id="tab-info-weapons">0/8</span>
                </button>
                <button class="tab-btn" data-tab="trinkets">
                    <img src="https://windblown.wiki.gg/images/Trinkets_Icon.png?format=original" alt="" class="tab-icon">
                    <span class="tab-info" id="tab-info-trinkets">0/8</span>
                </button>
                <button class="tab-btn" data-tab="magifishes">
                    <img src="https://windblown.wiki.gg/images/Magifishes_Icon.png?format=original" alt="" class="tab-icon">
                    <span class="tab-info" id="tab-info-magifishes">0/2</span>
                </button>
                <button class="tab-btn" data-tab="gifts">
                    <img src="https://windblown.wiki.gg/images/Gifts_Icon.png?format=original" alt="" class="tab-icon">
                    <span class="tab-info" id="tab-info-gifts">0/35</span>
                </button>
                <button class="tab-btn" data-tab="hexes">
                    <img src="https://windblown.wiki.gg/images/Hexes_Icon.png?format=original" alt="" class="tab-icon">
                    <span class="tab-info" id="tab-info-hexes">0/8</span>
                </button>
            </nav>

            <section id="weapons" class="category-panel active"></section>
            <section id="trinkets" class="category-panel"></section>
            <section id="magifishes" class="category-panel"></section>
            <section id="gifts" class="category-panel"></section>
            <section id="hexes" class="category-panel"></section>
        </section>

        <aside id="deck-summary">
            <div id="deck-grid" class="deck-grid"></div>
            <div id="global-total" class="global-total">0/80 minimum</div>

            <div class="actions">
                <button id="btn-export">Export</button>
                <button id="btn-import">Import</button>
                <button id="btn-reset">Reset</button>
                <input type="file" id="import-file" accept=".json" hidden>
            </div>

	    <p class="copyright-notice sidebar-copyright">

	    </p>
        </aside>
    </main>

    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/data.js"></script>
    <script src="js/build.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
